<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .Title }}{{ .Title }} | {{ site.Title }}{{ else }}{{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description | default site.Title }}{{ end }}">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <nav class="container nav">
          <a class="site-title" href="{{ "/" | relURL }}">{{ site.Title }}</a>
          <div class="nav-links">
            <a href="{{ "/" | relURL }}">Home</a>
            <a href="{{ "story/" | relURL }}">Story</a>
            <a href="{{ "timeline/" | relURL }}">Timeline</a>
            <a href="{{ "gallery/" | relURL }}">Gallery</a>
            <a href="{{ "memories/" | relURL }}">Memories</a>
          </div>
        </nav>
      </header>

      <main class="container">
        {{ block "main" . }}{{ end }}
      </main>

      <footer class="container site-footer">
        <p>© {{ now.Year }} {{ site.Title }}</p>
      </footer>
    </div>
  </body>
</html>
