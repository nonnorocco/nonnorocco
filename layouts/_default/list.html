{{ define "main" }}
<section class="section-block">
  <header class="section-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}
    <div class="content-body">
      {{ . }}
    </div>
    {{ end }}
  </header>

  {{ if .Pages }}
  <div class="card-grid">
    {{ range .Pages }}
    <article class="card">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}</p>
    </article>
    {{ end }}
  </div>
  {{ end }}
</section>
{{ end }}
