{{ define "main" }}
<section class="hero">
  <p class="eyebrow">A quiet place for remembrance</p>
  <h1>{{ .Title }}</h1>
  <div class="hero-content">
    {{ .Content }}
  </div>
</section>

{{ if .Pages }}
<section class="section-block">
  <h2>Explore</h2>
  <div class="card-grid">
    {{ range .Pages }}
    <article class="card">
      <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
      <p>{{ with .Description }}{{ . }}{{ else }}{{ .Summary | plainify }}{{ end }}</p>
    </article>
    {{ end }}
  </div>
</section>
{{ end }}
{{ end }}
